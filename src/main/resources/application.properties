spring.application.name=handoff-service

# WebFlux is on the classpath only for the WebSocket client. Without this,
# Spring Boot would start Netty instead of Tomcat and the MVC controllers
# would never be mapped.
spring.main.web-application-type=servlet

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/handoff}
spring.datasource.username=${DB_USERNAME:handoff}
spring.datasource.password=${DB_PASSWORD:handoff}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway owns the schema. Hibernate only validates that the entities match it.
spring.flyway.enabled=true

# ---------------------------------------------------------------------------
# Redis (not used while handoff.coordination.mode=memory)
# ---------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
# Lets in-flight webhooks finish before the instance stops. Matters more here
# than usual: shutdown also releases socket ownership.
server.shutdown=graceful

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# Vendor APIs are deliberately excluded from readiness. If a vendor is down,
# marking every instance unready removes the whole service from the load
# balancer and stops the escalation endpoint returning a useful error.
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

# ---------------------------------------------------------------------------
# Handoff Service
# ---------------------------------------------------------------------------

# ElevenLabs monitoring socket. The endpoint delivers no ping events, so
# keepalive is our responsibility.
handoff.socket.keepalive-interval=20s
handoff.socket.keepalive-timeout=10s
handoff.socket.max-per-instance=500
handoff.socket.reconnect.initial-delay=500ms
handoff.socket.reconnect.max-delay=15s
handoff.socket.reconnect.max-attempts=10

# Coordination. memory: single instance, no infrastructure required.
# Switch to redis once the Redis implementations exist and more than one
# instance is running.
handoff.coordination.mode=memory
handoff.coordination.ownership-ttl=30s
handoff.coordination.refresh-interval=10s
handoff.coordination.buffer-ttl=30m

# Reconciliation picks up journeys whose owning instance has died.
handoff.reconciliation.interval=15s

# Idempotency ledger. Retention exceeds any vendor retry window.
handoff.idempotency.stalled-after=30s
handoff.idempotency.retention=7d

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
#logging.level.com.dbu.handoff=INFO
logging.level.com.dbu.handoff=DEBUG

handoff.vendors.mode=logging

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management.health.redis.enabled=false


# Genesys outbound webhook. The secret is set on the Open Messaging integration
# and is what Genesys signs each delivery with. Comes from the secret store in
# every environment above local.
handoff.genesys.webhook-secret=${GENESYS_WEBHOOK_SECRET:local-dev-secret}

# Accepted alongside the current secret during rotation, so the changeover does
# not produce a burst of rejected deliveries. Left blank when not rotating.
handoff.genesys.webhook-secret-previous=${GENESYS_WEBHOOK_SECRET_PREVIOUS:}

