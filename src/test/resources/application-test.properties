# Test profile: a separate database so tests never touch development data.
#
# Create it once:
#   CREATE DATABASE handoff_test;
#   GRANT ALL PRIVILEGES ON DATABASE handoff_test TO handoff;
#   \c handoff_test
#   GRANT ALL ON SCHEMA public TO handoff;

spring.datasource.url=jdbc:postgresql://localhost:5432/handoff_test
spring.datasource.username=handoff
spring.datasource.password=handoff

# Flyway rebuilds the schema on each run, so a failed test never leaves the
# database in a state that breaks the next one.
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true

# Redis is not needed: coordination runs in memory.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

handoff.coordination.mode=memory

logging.level.com.dbu.handoff=DEBUG

handoff.vendors.mode=test

handoff.genesys.webhook-secret=test-secret